apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-efs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-efs
  template:
    metadata:
      labels:
        app: nginx-efs
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: volumen-web
              mountPath: /usr/share/nginx/html
      volumes:
        - name: volumen-web
          persistentVolumeClaim:
            claimName: efs-pvc
