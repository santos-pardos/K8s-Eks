apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hostpath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hostpath
  template:
    metadata:
      labels:
        app: nginx-hostpath
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: datos-web
              mountPath: /usr/share/nginx/html
      volumes:
        - name: datos-web
          hostPath:
            path: /datos/nginx-hostpath
            type: DirectoryOrCreate
